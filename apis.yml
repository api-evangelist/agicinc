aid: agicinc
name: Elephantech
description: 'Elephantech Inc. (founded January 2014 in Tokyo as AgIC Inc., renamed
  Elephantech in September 2017) develops, manufactures and sells precision metal
  inkjet printing equipment, advanced conductive materials, and flexible printed
  circuit board products, including its SustainaCircuits multilayer PCB line and
  NeuralJet printing technology. The company positions itself as decarbonizing
  electronics manufacturing by replacing subtractive copper etching with additive
  inkjet deposition. It is a hardware and materials manufacturer with roughly 150
  employees, headquartered at 4-3-8 Hatchobori, Chuo-ku, Tokyo; it publishes no
  developer program, public API, SDK or machine-readable API contract.'
